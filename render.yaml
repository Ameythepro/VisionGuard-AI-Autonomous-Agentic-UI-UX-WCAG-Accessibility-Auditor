services:
  - type: web
    name: visionguard-backend
    env: docker
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PLAYWRIGHT_HEADLESS
        value: "true"
      - key: GEMINI_MODEL
        value: "gemini-3.5-flash-lite"
      - key: GOOGLE_API_KEY
        sync: false
